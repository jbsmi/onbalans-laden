# Dashboard "Onbalans laden"
# Gebruik: Instellingen > Dashboards > Dashboard toevoegen > "Nieuw dashboard vanaf nul"
# > openen > potlood > drie puntjes > "Ruwe configuratie-editor" > alles vervangen door deze inhoud > Opslaan.
# Wijzigingen in de blok-velden worden direct opgeslagen en toegepast (geen herstart/herlaad nodig).
title: Onbalans laden
views:
  - title: Tijdblokken
    path: tijdblokken
    icon: mdi:battery-clock
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: tile
            entity: sensor.onbalans_laden_onbalansprijs
          - type: tile
            entity: sensor.onbalans_laden_status
          - type: tile
            entity: sensor.onbalans_laden_actief_tijdblok
          - type: tile
            entity: sensor.onbalans_laden_laadvermogen_setpoint
          - type: tile
            entity: switch.onbalans_laden_automatische_sturing
            features:
              - type: toggle
          - type: tile
            entity: switch.onbalans_laden_testmodus_niet_versturen
            features:
              - type: toggle
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set s = 'sensor.onbalans_laden_actief_tijdblok' %}
              {%- set blokken = state_attr(s, 'blokken') or [] %}
              {%- set nu = state_attr(s, 'actief_nr') %}
              | # | Tijd | Aan | Laden als prijs | Drempel | Start bij | Stop bij | Vertraging start / stop | kW |
              |:-:|:--|:-:|:--|--:|--:|--:|:-:|--:|
              {% for b in blokken -%}
              {%- set onder = b.modus == 'below' -%}
              {%- set laag = b.drempel - b.offset_onder -%}
              {%- set hoog = b.drempel + b.offset_boven -%}
              | {{ '**▶ ' ~ b.nr ~ '**' if b.nr == nu else b.nr }} | {{ b.start }}–{{ b.eind }} | {{ '✅' if b.actief else '⛔' }} | {{ '≤ (onder)' if onder else '≥ (boven)' }} | {{ b.drempel }} | {{ (laag if onder else hoog) | round(2) }} | {{ (hoog if onder else laag) | round(2) }} | {{ b.vertraging_start }} s / {{ b.vertraging_stop }} s | {{ b.vermogen_kw }} |
              {% endfor %}
              *Prijzen in €/MWh. ▶ = actief blok. Pas de waarden aan in de blokken hieronder; ze worden direct opgeslagen.*
      - type: grid
        cards:
          - type: heading
            heading: Blok 1
            icon: mdi:numeric-1-box-outline
          - type: entities
            grid_options:
              columns: full
            state_color: true
            entities:
              - entity: switch.onbalans_laden_blok_1_actief
                name: Actief
              - entity: time.onbalans_laden_blok_1_start
                name: Start
              - entity: time.onbalans_laden_blok_1_eind
                name: Eind
              - entity: select.onbalans_laden_blok_1_modus
                name: Laden als prijs
              - entity: number.onbalans_laden_blok_1_drempel
                name: Drempel
              - entity: number.onbalans_laden_blok_1_offset_onder
                name: Offset onder
              - entity: number.onbalans_laden_blok_1_offset_boven
                name: Offset boven
              - entity: number.onbalans_laden_blok_1_vertraging_start
                name: Vertraging start
              - entity: number.onbalans_laden_blok_1_vertraging_stop
                name: Vertraging stop
              - entity: number.onbalans_laden_blok_1_vermogen
                name: Vermogen
