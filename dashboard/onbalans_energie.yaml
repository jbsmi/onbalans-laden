      # ---------------------------------------------------------------- grafiek
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Verloop
            icon: mdi:chart-line
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            graph_span: 24h
            header:
              show: true
              title: Onbalansprijs, laden en accu – laatste 24 uur
              show_states: true
              colorize_states: true
            now:
              show: true
              label: nu
            apex_config:
              chart:
                height: 420
              legend:
                show: true
              tooltip:
                shared: true
            yaxis:
              - id: prijs
                decimals: 1
                apex_config:
                  title:
                    text: Prijs
              - id: kw
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: kW
              - id: soc
                opposite: true
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: SOC %
              - id: laden
                show: false
                min: 0
                max: 1
            series:
              - entity: binary_sensor.onbalans_laden_laden
                name: Laden aan
                yaxis_id: laden
                type: area
                curve: stepline
                color: '#4caf50'
                opacity: 0.15
                stroke_width: 0
                transform: "return x === 'on' ? 1 : 0;"
                show:
                  in_header: false
                  legend_value: false
              - entity: sensor.onbalans_laden_onbalansprijs
                name: Onbalansprijs
                yaxis_id: prijs
                type: line
                curve: stepline
                color: '#2196f3'
                stroke_width: 2
                extend_to: now
              - entity: sensor.onbalans_laden_drempel
                attribute: startgrens
                name: Startgrens
                yaxis_id: prijs
                type: line
                curve: stepline
                color: '#4caf50'
                stroke_width: 1
                show:
                  in_header: false
              - entity: sensor.onbalans_laden_drempel
                attribute: stopgrens
                name: Stopgrens
                yaxis_id: prijs
                type: line
                curve: stepline
                color: '#f44336'
                stroke_width: 1
                show:
                  in_header: false
              - entity: sensor.onbalans_laden_laadvermogen_setpoint
                name: Laadvermogen (setpoint)
                yaxis_id: kw
                type: line
                curve: stepline
                color: '#ff9800'
                stroke_width: 2
              - entity: sensor.rs_system_0_dc_battery_power
                name: Werkelijk laadvermogen
                yaxis_id: kw
                type: line
                curve: smooth
                color: '#9c27b0'
                stroke_width: 2
              - entity: sensor.multiplus_ii_48_10000_140_100_id_276_dc_power
                name: MultiPlus 10kVA laadvermogen
                yaxis_id: kw
                type: line
                curve: stepline
                color: '#e91e63'
                stroke_width: 2
                transform: "return x / 1000;"
                unit: kW
                float_precision: 2
              - entity: sensor.rs_system_0_dc_battery_charge
                name: Accu SOC
                yaxis_id: soc
                type: line
                curve: smooth
                color: '#009688'
                stroke_width: 2

      # ---------------------------------------------------------------- laatste acties
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Laatste start- en stopmomenten
            icon: mdi:history
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set acties = state_attr('sensor.onbalans_laden_status', 'laatste_acties') or [] %}
              {%- set eh = state_attr('sensor.onbalans_laden_onbalansprijs', 'eenheid') or '€/MWh' %}
              {%- set f = {'€/MWh': 1, 'ct/kWh': 0.1, '€/kWh': 0.001}.get(eh, 1) %}
              {%- if acties | count == 0 %}
              Nog geen start- of stopmomenten sinds de laatste herstart.
              {%- else %}
              | Tijd | Actie | Vermogen | Prijs ({{ eh }}) | Reden |
              |:--|:--|--:|--:|:--|
              {% for a in acties[:10] -%}
